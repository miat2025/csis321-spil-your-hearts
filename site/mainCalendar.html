<!DOCTYPE html>
<html>
    <head>
        <title>
            CSIS 321 Project
        </title>
        <link rel="stylesheet" href="reset.css">
        <link rel="stylesheet" href="style.css">
        <meta charset = "UTF-8">
        <meta name ="viewport" content="width-device-width, initial-scale=1.0">
    </head>
    <body>
        <div id="main-contain">
            <div id = "nav-container">
                <div id = "nav-logo" class = "nav-element">
                    <img id= nav-spillogo class = "body-image" src = "SPILlogo.png" alt = "spiL_logo">
                </div>
                <div id = "nav-links" class = "nav-element">
                    <a href = "#" class = "nav-link-element">Home</a>
                    <a href = "interestForm.html" class = "nav-link-element">Interest Form</a>
                    <a href = "mainCalendar.html" class = "nav-link-element">Main Calendar</a>
                    <a href = "aboutUs.html" class = "nav-link-element">About Us</a>
                </div>
                <div class="nav-head">
                    GFU SpiL
                </div>
            </div>
        </div>
        <div id = "body-container">
                <h1>Main Calendar</h1>
            </div>
        <div id="month-container">
            <div id="month-head">
                <div id="monthDisplay"></div>
                <div>
                    <button id="backButton">Back</button>
                    <button id="nextButton">Next</button>
                </div>
            </div>
        </div>
        <div>
            <div id="calendar-container">
                <div id="calendar-head"></div>
                <div id="week-view">
                    <div>Sunday</div>
                    <div>Monday</div>
                    <div>Tuesday</div>      
                    <div>Wednesday</div>
                    <div>Thursday</div>
                    <div>Friday</div>
                    <div>Saturday</div>
                </div>
                <div id="calendar-view"></div>
            </div>

            <div id="newEventModal">
                <h2>New Event</h2>
                <input id="eventTitleInput" placeholder="Event Title" />

                <button id="saveButton">Save</button>
                <button id="cancelButton">Cancel</button>
            </div>
            <div id="deleteEventModal">
                <h2>Event</h2>

                <p id="eventText"></p>
                
                <button id="deleteButton">Delete</button>
                <button id="closeButton">Close</button>
            </div>
        </div>
        <div id="modalBackDrop"></div>

        <script src="./calendarscript.js"></script>

        <div id = "foot-container"></div>
                <div id = "nav-footer" class = "nav-element">
                    <img class = "footer-image" src = "GFU image.png" alt = "GFU_logo">
                </div>
        </div>
    </body>
</html>
